<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando números</title>
</head>
<body>
    <h1>Somando Valores</h1>
    <input type='number' name ='txtn1' id='txtn1'>; <!--cria um lugar para por números-->
    <input type="number" name="txtn2" id="txtn2">;
    <input type="button" value="Somar" onclick='somar()'> <!--cria um botão escrito somar-->
    <div id="res">Resultado</div>
    <script>
        function somar(){
            var tn1=window.document.getElementById('txtn1')
            var tn2=window.document.getElementById('txtn2')
            var res=window.document.getElementById('res')

            let n1= Number(tn1.value); //transforma o valor de tn1 em número, pois ele saiu de uma caixa de texto, sendo uma string.
            let n2= Number(tn2.value);
            let s = n1+n2;
            res.innerHTML=`A soma entre ${n1} e ${n2} é <strong>${s}<strong>.`
        }
    </script>
</body>
</html>
